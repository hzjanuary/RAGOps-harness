<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAGOps Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <main class="mx-auto flex min-h-screen w-full max-w-6xl flex-col gap-6 px-6 py-8">
      <header class="flex flex-col gap-2 border-b border-zinc-800 pb-5">
        <p class="text-sm font-medium uppercase tracking-[0.18em] text-cyan-300">RAGOps Harness</p>
        <div class="flex flex-wrap items-end justify-between gap-4">
          <div>
            <h1 class="text-3xl font-semibold tracking-normal text-white">FinOps Dashboard</h1>
            <p id="status" class="mt-2 text-sm text-zinc-400">Loading local usage metrics...</p>
          </div>
          <button
            id="refresh"
            class="h-10 rounded-md border border-zinc-700 px-4 text-sm font-medium text-zinc-100 transition hover:border-cyan-400 hover:text-cyan-200"
            type="button"
          >
            Refresh
          </button>
        </div>
      </header>

      <section class="grid gap-4 md:grid-cols-3">
        <article class="rounded-lg border border-zinc-800 bg-zinc-900 p-5">
          <p class="text-sm text-zinc-400">Total Cost</p>
          <p id="total-cost" class="mt-3 text-3xl font-semibold text-white">$0.000000</p>
        </article>
        <article class="rounded-lg border border-zinc-800 bg-zinc-900 p-5">
          <p class="text-sm text-zinc-400">Requests</p>
          <p id="total-requests" class="mt-3 text-3xl font-semibold text-white">0</p>
        </article>
        <article class="rounded-lg border border-zinc-800 bg-zinc-900 p-5">
          <p class="text-sm text-zinc-400">Avg Latency</p>
          <p id="avg-latency" class="mt-3 text-3xl font-semibold text-white">0 ms</p>
        </article>
      </section>

      <section class="grid flex-1 gap-4 lg:grid-cols-[1.3fr_1fr]">
        <article class="rounded-lg border border-zinc-800 bg-zinc-900 p-5">
          <div class="mb-5 flex items-center justify-between gap-4">
            <h2 class="text-lg font-semibold text-white">Latest Request Costs</h2>
            <span class="text-xs uppercase tracking-[0.18em] text-zinc-500">Top 5</span>
          </div>
          <div class="h-80">
            <canvas id="cost-chart"></canvas>
          </div>
        </article>

        <article class="rounded-lg border border-zinc-800 bg-zinc-900 p-5">
          <h2 class="text-lg font-semibold text-white">Latest Logs</h2>
          <div id="latest-logs" class="mt-4 flex flex-col gap-3"></div>
        </article>
      </section>
    </main>

    <script>
      const totalCostElement = document.getElementById("total-cost");
      const totalRequestsElement = document.getElementById("total-requests");
      const avgLatencyElement = document.getElementById("avg-latency");
      const latestLogsElement = document.getElementById("latest-logs");
      const statusElement = document.getElementById("status");
      const refreshButton = document.getElementById("refresh");
      const chartCanvas = document.getElementById("cost-chart");
      let costChart;

      async function fetchStats() {
        const response = await fetch("/api/stats", {
          headers: {
            Accept: "application/json"
          }
        });

        if (!response.ok) {
          throw new Error(`Stats API returned ${response.status}`);
        }

        const stats = await response.json();
        if (stats.error) {
          throw new Error(stats.error.message || "Stats API failed");
        }

        return stats;
      }

      function formatCurrency(value) {
        return `$${Number(value || 0).toFixed(6)}`;
      }

      function formatLatency(value) {
        return `${Math.round(Number(value || 0))} ms`;
      }

      function renderStats(stats) {
        totalCostElement.textContent = formatCurrency(stats.total_cost_usd);
        totalRequestsElement.textContent = String(stats.total_requests || 0);
        avgLatencyElement.textContent = formatLatency(stats.avg_latency_ms);
      }

      function renderLogs(logs) {
        latestLogsElement.innerHTML = "";

        if (!logs.length) {
          latestLogsElement.innerHTML =
            '<div class="rounded-md border border-zinc-800 bg-zinc-950 p-4 text-sm text-zinc-400">No FinOps logs found in the local database.</div>';
          return;
        }

        for (const log of logs) {
          const row = document.createElement("div");
          row.className = "rounded-md border border-zinc-800 bg-zinc-950 p-4";
          row.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <p class="truncate text-sm font-medium text-white">${log.model}</p>
                <p class="mt-1 truncate text-xs text-zinc-500">${log.request_id}</p>
              </div>
              <span class="rounded bg-zinc-800 px-2 py-1 text-xs text-zinc-300">${log.status_code}</span>
            </div>
            <div class="mt-3 grid grid-cols-2 gap-3 text-xs text-zinc-400">
              <span>${formatCurrency(log.cost_usd)}</span>
              <span class="text-right">${formatLatency(log.latency_ms)}</span>
            </div>
            <p class="mt-2 text-xs text-zinc-600">${log.created_at}</p>
          `;
          latestLogsElement.appendChild(row);
        }
      }

      function renderChart(logs) {
        const labels = logs.map((log) => log.model || "unknown").reverse();
        const costs = logs.map((log) => Number(log.cost_usd || 0)).reverse();

        if (costChart) {
          costChart.destroy();
        }

        costChart = new Chart(chartCanvas, {
          type: "bar",
          data: {
            labels,
            datasets: [
              {
                label: "Cost USD",
                data: costs,
                backgroundColor: "rgba(34, 211, 238, 0.65)",
                borderColor: "rgb(34, 211, 238)",
                borderWidth: 1,
                borderRadius: 4
              }
            ]
          },
          options: {
            maintainAspectRatio: false,
            plugins: {
              legend: {
                labels: {
                  color: "#d4d4d8"
                }
              }
            },
            scales: {
              x: {
                ticks: {
                  color: "#a1a1aa"
                },
                grid: {
                  color: "rgba(63, 63, 70, 0.35)"
                }
              },
              y: {
                beginAtZero: true,
                ticks: {
                  color: "#a1a1aa"
                },
                grid: {
                  color: "rgba(63, 63, 70, 0.35)"
                }
              }
            }
          }
        });
      }

      async function loadDashboard() {
        refreshButton.disabled = true;
        statusElement.textContent = "Loading local usage metrics...";

        try {
          const stats = await fetchStats();
          const logs = stats.latest_logs || [];

          renderStats(stats);
          renderLogs(logs);
          renderChart(logs);
          statusElement.textContent = "Showing metrics from the local proxy database.";
        } catch (error) {
          statusElement.textContent = `Dashboard load failed: ${error.message || error}`;
        } finally {
          refreshButton.disabled = false;
        }
      }

      refreshButton.addEventListener("click", loadDashboard);
      loadDashboard();
    </script>
  </body>
</html>
